name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  python-tests:
    name: Python tests
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run tests
        run: python tests/run_tests.py

  frontend:
    name: Build Vuetify frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload webui artifact
        uses: actions/upload-artifact@v4
        with:
          name: sycu-course-grabber-webui
          path: frontend/dist/*
          if-no-files-found: error

